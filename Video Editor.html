<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lyric Video Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Cairo:wght@400;700;900&family=Dancing+Script:wght@600;700&family=Inter:wght@400;600;800&family=Lobster&family=Montserrat:wght@400;700;900&family=Orbitron:wght@500;800&family=Oswald:wght@400;700&family=Pacifico&family=Playfair+Display:wght@500;800&family=Poppins:wght@400;600;700;800&family=Righteous&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--p1:#151a20;--p2:#1c222a;--p3:#252d37;--bd:#2b333d;--tx:#e8edf2;--mut:#8a95a2;--ac:#2de2b0;--red:#ff4d6d}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 Inter,system-ui,Segoe UI,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;height:100vh;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:50px minmax(0,1fr) 290px;grid-template-areas:"top top" "stage panel" "tl tl"}
#top{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--p1);border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap}
.brand{font-weight:800;letter-spacing:.02em;margin-right:6px}
.brand b{color:var(--ac)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--p3);border:1px solid var(--bd);border-radius:7px;padding:6px 11px;cursor:pointer;user-select:none;white-space:nowrap}
.btn:hover{border-color:#47525f}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#04110d;font-weight:700}
.btn.danger{color:#ff8a9d}
.btn.sm{padding:3px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
.seg button{background:var(--p2);border:0;padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--ac);color:#04110d;font-weight:700}
select,input[type=text],input[type=number],textarea{background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:5px 7px;min-width:0}
textarea{width:100%;resize:vertical}
#stage{grid-area:stage;display:flex;flex-direction:column;min-width:0;min-height:0}
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#08090b;padding:12px}
#view{border-radius:6px;box-shadow:0 10px 50px rgba(0,0,0,.6);touch-action:none;background:#000}
#transport{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--p1);border-top:1px solid var(--bd);flex-wrap:wrap}
#timeTxt{font-variant-numeric:tabular-nums;min-width:120px}
.mut{color:var(--mut)}
#panel{grid-area:panel;display:flex;flex-direction:column;background:var(--p1);border-left:1px solid var(--bd);min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--bd)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 2px;cursor:pointer;color:var(--mut);font-size:12px}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
#panelBody{flex:1;overflow:auto;padding:4px 12px 20px}
.sec{font-weight:700;margin:16px 0 4px;color:var(--ac);text-transform:uppercase;font-size:11px;letter-spacing:.08em}
.f{display:grid;grid-template-columns:104px 1fr 46px;gap:6px;align-items:center;margin:6px 0}
.f.nv>:nth-child(2){grid-column:2/4}
.f label{color:var(--mut);font-size:12px}
.f input[type=range]{width:100%;accent-color:var(--ac)}
.f input[type=color]{width:38px;height:26px;padding:0;border:1px solid var(--bd);border-radius:5px;background:none;cursor:pointer}
.f .val{font-size:11px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.f select,.f input[type=text],.f input[type=number]{width:100%}
.colw{display:flex;gap:6px;align-items:center}
.hint{color:var(--mut);font-size:11.5px;margin:6px 0}
.elrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--bd);border-radius:7px;margin:4px 0;cursor:pointer;background:var(--p2)}
.elrow.on{border-color:var(--ac);background:#17342d}
.elrow span{flex:1}
.caprow{display:grid;grid-template-columns:54px 54px 1fr 24px;gap:4px;margin:4px 0;padding:4px;border:1px solid var(--bd);border-radius:7px;background:var(--p2)}
.caprow.on{border-color:var(--ac)}
.caprow input{padding:3px 5px;font-size:12px;width:100%}
.caprow .x{background:none;border:0;color:#ff8a9d;cursor:pointer}
.row2{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#tl{grid-area:tl;display:flex;flex-direction:column;background:var(--p1);border-top:1px solid var(--bd);min-height:0;min-width:0}
.tlbar{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tlbar label{display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-size:12px}
.tlbar input[type=number]{width:56px;padding:3px 5px}
.tlbody{flex:1;display:flex;min-height:0;overflow-y:auto;align-items:flex-start}
#tlLabels{width:96px;flex:none;background:var(--p2);border-right:1px solid var(--bd)}
.lab{display:flex;align-items:center;padding:0 8px;color:var(--mut);font-size:11px;border-bottom:1px solid var(--bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tlScroll{flex:1;overflow-x:auto;overflow-y:hidden;position:relative;min-width:0}
#tlScroll.panning,#tlScroll.panning *{cursor:grabbing!important}
#tlInner{position:relative}
.row{position:relative;border-bottom:1px solid var(--bd);overflow:visible}
canvas.stick{position:sticky;left:0;display:block}
.clip{position:absolute;top:4px;bottom:4px;border-radius:5px;background:rgba(45,226,176,.32);border:1px solid rgba(45,226,176,.85);overflow:hidden;cursor:grab;display:flex;align-items:center;font-size:11px;padding:0 9px;user-select:none;white-space:nowrap}
.clip.fx{background:rgba(124,156,255,.32);border-color:rgba(124,156,255,.9)}
.clip.sel{outline:2px solid #fff;z-index:2}
.clip .hl,.clip .hr{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;background:rgba(255,255,255,.22);z-index:3}
.clip .hl{left:0}.clip .hr{right:0}
/* Animation Freeze Shaded Zones */
.clip .fz-in{position:absolute;top:0;bottom:0;left:0;background:rgba(6,182,212,.25);border-right:1px solid rgba(6,182,212,.7);pointer-events:none;z-index:1}
.clip .fz-out{position:absolute;top:0;bottom:0;right:0;background:rgba(245,158,11,.25);border-left:1px solid rgba(245,158,11,.7);pointer-events:none;z-index:1}
/* Draggable Freeze Handles */
.clip .hfi{position:absolute;top:2px;bottom:2px;width:6px;border-radius:3px;background:#06b6d4;border:1px solid #fff;cursor:ew-resize;z-index:5;box-shadow:0 0 6px rgba(6,182,212,.9)}
.clip .hfo{position:absolute;top:2px;bottom:2px;width:6px;border-radius:3px;background:#f59e0b;border:1px solid #fff;cursor:ew-resize;z-index:5;box-shadow:0 0 6px rgba(245,158,11,.9)}
.clip .hfi:hover{background:#22d3ee;transform:scaleX(1.3)}
.clip .hfo:hover{background:#fbbf24;transform:scaleX(1.3)}
.clip .lab2{pointer-events:none;overflow:hidden;text-overflow:ellipsis;z-index:2;position:relative}
/* Audio Trim Span & Handles on Timeline */
.audio-trim-region {
  position: absolute;
  top: 0;
  bottom: 0;
  background: rgba(45, 226, 176, 0.18);
  border-top: 2px solid var(--ac);
  border-bottom: 2px solid var(--ac);
  cursor: grab;
  z-index: 4;
}
.audio-trim-region:active { cursor: grabbing; }
.audio-trim-dim {
  position: absolute;
  top: 0;
  bottom: 0;
  background: rgba(8, 10, 14, 0.72);
  pointer-events: none;
  z-index: 3;
}
.trim-handle {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 10px;
  background: var(--ac);
  cursor: ew-resize;
  z-index: 8;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 8px rgba(45, 226, 176, 0.6);
}
.trim-handle:after {
  content: '';
  width: 2px;
  height: 24px;
  background: #04110d;
  border-radius: 1px;
}
.trim-handle.start { left: 0; border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.trim-handle.end { right: 0; border-top-right-radius: 4px; border-bottom-right-radius: 4px; }

/* Global In/Out Work Area / Render Markers on Ruler */
.ruler-marker {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 14px;
  cursor: ew-resize;
  z-index: 10;
  user-select: none;
}
.ruler-marker.in { border-left: 3px solid #38bdf8; background: linear-gradient(90deg, rgba(56,189,248,0.4), transparent); }
.ruler-marker.out { border-right: 3px solid #ff4d6d; background: linear-gradient(-90deg, rgba(255,77,109,0.4), transparent); }
.playhead{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--red);pointer-events:none;z-index:6;will-change:transform}
.playhead:before{content:'';position:absolute;top:0;left:-6px;border:7px solid transparent;border-top-color:var(--red)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;border:1px solid var(--bd);padding:8px 14px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.on{opacity:1}
.mback{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:40}
.mback.hidden{display:none}
.modal{background:var(--p1);border:1px solid var(--bd);border-radius:12px;padding:18px;width:min(560px,92vw);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px}
.bar{height:10px;background:var(--p3);border-radius:6px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;width:0;background:var(--ac)}
@media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:50px 45vh 40vh 290px;grid-template-areas:"top" "stage" "panel" "tl";overflow:auto}html,body{overflow:auto}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">♪ Lyric<b>Video</b> Studio</div>
    <div class="seg" id="aspectSeg">
  <button data-a="9:16" class="on">9:16 Story</button>
  <button data-a="16:9">16:9 Wide</button>
  <button data-a="1:1">1:1 Square</button>
  <button data-a="4:5">4:5 Portrait</button>
  <button data-a="3:4">3:4 Feed</button>
</div>
    <select id="tplSel" title="Template"></select>
    <button class="btn sm" id="bUndo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="btn sm" id="bRedo" title="Redo (Ctrl+Y)">↷ Redo</button>
    <span class="sp"></span>
    <label class="btn">🎵 Audio<input id="audioIn" type="file" accept="audio/*" hidden></label>
    <label class="btn">🖼 Thumbnail<input id="coverIn" type="file" accept="image/*" hidden></label>
    <label class="btn">🌄 Background<input id="bgTopIn" type="file" accept="image/*,video/*" hidden></label>
    <button class="btn" id="bSave">💾 Save</button>
    <label class="btn">📂 Open<input id="openIn" type="file" accept=".json,application/json" hidden></label>
    <button class="btn primary" id="bExportTop">⬇ Export</button>
  </header>

  <main id="stage">
    <div id="stageWrap" style="position:relative">
      <canvas id="view"></canvas>
      <textarea id="inlineCapEdit" style="display:none;position:fixed;z-index:100;background:rgba(13,15,18,.92);color:#fff;border:2px solid var(--ac);border-radius:8px;padding:8px 12px;text-align:center;font-weight:700;outline:none;resize:none;box-shadow:0 10px 30px rgba(0,0,0,.7)"></textarea>
    </div>
    <div id="transport">
      <button class="btn" id="bRestart" title="Back to start">⏮</button>
      <button class="btn primary" id="bPlay" style="min-width:92px">▶ Play</button>
      <span id="timeTxt">0:00.0 / 0:00.0</span>
      <span class="mut" id="audName">No audio loaded (demo clock)</span>
      <span class="sp"></span>
      <!-- Audio Track Trim Adjust Controls -->
      <div id="audioTrimWrap" style="display:inline-flex;align-items:center;gap:6px;background:var(--p2);padding:2px 8px;border-radius:6px;border:1px solid var(--bd)">
        <span style="font-size:11px;color:var(--ac);font-weight:700">✂ Trim:</span>
        <label class="mut" style="font-size:11px">Start <input id="trimStartIn" type="number" min="0" step="0.1" value="0" style="width:58px;padding:2px 4px"></label>
        <label class="mut" style="font-size:11px">End <input id="trimEndIn" type="number" min="0.5" step="0.1" value="32" style="width:58px;padding:2px 4px"></label>
        <button class="btn sm" id="bOpenVisualTrim" title="Open Full Waveform Range Selector" style="padding:2px 8px;font-size:11px;background:var(--ac);color:#04110d;font-weight:700">🔍 Pick Range</button>
        <button class="btn sm" id="bResetTrim" title="Reset Audio Trim" style="padding:1px 6px;font-size:11px">↺</button>
      </div>
      <label id="lenWrap" class="mut">Length <input id="lenIn" type="number" min="3" max="3600" step="1" style="width:64px"> s</label>
      <label class="mut">Monitor <input id="monVol" type="range" min="0" max="1" step="0.01" value="1" style="width:90px"></label>
    </div>
  </main>

  <aside id="panel">
    <div class="tabs" id="tabs"></div>
    <div id="panelBody"></div>
  </aside>

  <section id="tl">
    <div class="tlbar">
      <button class="btn sm" id="tAdd">＋ Caption</button>
      <button class="btn sm" id="tAddTrack" title="Add another caption track">＋ Cap Track</button>
      <button class="btn sm" id="tCopy" title="Copy Selected (Ctrl+C)">⎘ Copy</button>
      <button class="btn sm" id="tPaste" title="Paste at Playhead (Ctrl+V)">📋 Paste</button>
      <button class="btn sm" id="tDup" title="Duplicate Selected (Ctrl+D)">⧉ Duplicate</button>
      <button class="btn sm" id="tSplit" title="Split at playhead (S)">✂ Split</button>
      <button class="btn sm danger" id="tDel" title="Delete (Del)">🗑 Delete</button>
      <button class="btn sm" id="tImport">📝 Lyrics</button>
      <label><input type="checkbox" id="tFill"> Auto-fill gaps</label>
      <label>max gap <input type="number" id="tGap" min="0" step="1">s</label>
      <label><input type="checkbox" id="tSnap"> Snap</label>
      <label><input type="checkbox" id="tFollow"> Follow</label>
      <span class="sp"></span>
      <label>Zoom <input type="range" id="tZoom" min="0" max="100" step="0.5" style="width:130px"></label>
      <button class="btn sm" id="tFit">Fit</button>
      <span class="mut" style="font-size:11px">Wheel = zoom · Middle-drag = pan · Space = play · S = split</span>
    </div>
    <div class="tlbody">
      <div id="tlLabels"></div>
      <div id="tlScroll"><div id="tlInner"></div></div>
    </div>
  </section>
</div>

<div id="toast"></div>
<div id="modal" class="mback hidden"><div class="modal" id="modalBox"></div></div>

<script>
'use strict';
/* ===================================================================
   Lyric Video Studio – single file
   =================================================================== */
/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,props,...kids){
  const e=document.createElement(tag);
  if(typeof props==='string') e.className=props;
  else if(props) for(const k in props){
    const v=props[k];
    if(k==='class') e.className=v;
    else if(k==='style') e.style.cssText=v;
    else if(k==='text') e.textContent=v;
    else if(k in e) e[k]=v;
    else e.setAttribute(k,v);
  }
  for(const kid of kids.flat()) if(kid!=null && kid!==false) e.append(kid.nodeType?kid:document.createTextNode(kid));
  return e;
}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=s=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)};
let _uid=1; const uid=()=>'i'+(_uid++)+Math.random().toString(36).slice(2,5);
const pad2=n=>String(Math.floor(n)).padStart(2,'0');
const fmtMS=t=>{t=Math.max(0,t||0);return pad2(t/60)+':'+pad2(t%60)};
const fmtT=(t,d=1)=>{t=Math.max(0,t||0);const m=Math.floor(t/60);const s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(d)};
function hex2rgb(hx){hx=(hx||'#000').replace('#','');if(hx.length===3)hx=hx.split('').map(x=>x+x).join('');const n=parseInt(hx,16);return[n>>16&255,n>>8&255,n&255]}
const rgba=(hx,a)=>{const[r,g,b]=hex2rgb(hx);return`rgba(${r},${g},${b},${a})`};
function mixHex(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);const m=i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,'0');return'#'+m(0)+m(1)+m(2)}
const lumin=hx=>{const[r,g,b]=hex2rgb(hx);return(0.2126*r+0.7152*g+0.0722*b)/255};
const easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const easeBounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600)}
function download(blob,name){const a=h('a',{href:URL.createObjectURL(blob),download:name});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
function rr(ctx,x,y,w,hh,r){r=Math.max(0,Math.min(r,w/2,hh/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+hh,r);ctx.arcTo(x+w,y+hh,x,y+hh,r);ctx.arcTo(x,y+hh,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function coverFit(ctx,img,x,y,w,hh){const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;if(!iw||!ih)return;const s=Math.max(w/iw,hh/ih);const sw=w/s,sh=hh/s;ctx.drawImage(img,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,hh)}

/* ---------- constants ---------- */
const DIM={
  '9:16':[1080,1920],
  '16:9':[1920,1080],
  '1:1':[1080,1080],
  '4:5':[1080,1350],
  '3:4':[1080,1440]
};
const FONTS=['Poppins','Montserrat','Inter','Playfair Display','Bebas Neue','Anton','Oswald','Pacifico','Lobster','Dancing Script','Orbitron','Righteous','Cairo','Arial'];
const stack=f=>`"${f}",system-ui,sans-serif`;
const MIN=0.1;
const ANIMS=[
  ['none','None'],['fade','Fade'],['slideUp','Slide up'],['slideDown','Slide down'],
  ['zoom','Zoom pop'],['blur','Blur in'],['typewriter','Typewriter'],
  ['karaoke','Karaoke (word by word)'],['sweep','Karaoke sweep (smooth)'],
  ['bounce','Letter bounce'],['wave','Letter wave'],['wordPop','Word pop'],['neon','Neon flicker'],
  ['elastic','Elastic spring'],['glitch','Cyber glitch'],['cinematic','Cinematic letter-spacing'],
  ['flip3d','3D Vertical flip'],['shimmer','Gold/glow wave'],['riseFade','Word-by-word rise'],['blurChar','Letter blur reveal']
];
const ICONS={
 play:'M8 5v14l11-7z',
 pause:'M6 19h4V5H6v14zm8-14v14h4V5h-4z',
 prev:'M6 6h2v12H6zm3.5 6l8.5 6V6z',
 next:'M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z',
 shuffle:'M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z',
 repeat:'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z',

      const wave = (isFrozenIn || isFrozenOut) ? 1 : (.5 + .5 * Math.sin(t * 4 - w.gi * .7));
      const col2 = mixHex(baseCol, cap.hl, wave);
      paintText(ctx, w.t, w.x, ln.y, col2, cap, c, { blur: cap.shadowBlur + wave * 16, shadowColor: cap.hl });
    }
  } else if (anim === 'riseFade') {
    for (const ln of lay.lines) for (const w of ln.ws) {
      if (isFrozenIn) continue;
      const lt = isFrozenOut ? 1 : easeOut(clamp((p - w.gi * .1) / .45, 0, 1));
      ctx.globalAlpha = clamp(lt * eOut, 0, 1);
      paintText(ctx, w.t, w.x, ln.y + (1 - lt) * 45 * st, baseCol, cap, c);
    }
  } else if (anim === 'blurChar') {
    for (const ln of lay.lines) for (const w of ln.ws) for (let j = 0; j < w.t.length; j++) {
      const idx = w.ci + j;
      const lt = (isFrozenIn || isFrozenOut) ? 1 : easeOut(clamp((p - idx * .03) / .4, 0, 1));
      ctx.save(); ctx.globalAlpha = clamp(lt * eOut, 0, 1);
      if (lt < .98 && 'filter' in ctx) ctx.filter = `blur(${(1 - lt) * 14 * c.sk}px)`;
      paintText(ctx, w.t[j], w.x + w.px[j], ln.y + (1 - lt) * 20 * st, baseCol, cap, c);
      ctx.restore();
    }
  } else {
    for (const ln of lay.lines) for (const w of ln.ws) paintText(ctx, w.t, w.x, ln.y, baseCol, cap, c);
  }

  if ('filter' in ctx) ctx.filter = 'none';
  ctx.restore();
}
/* ----- element drawers ----- */
function defCol(id,n){
  const th=S.theme;
  const m={panel:[th.text,th.accent],cards:[th.accent,th.text],cover:[th.accent,th.accent2],title:[th.text],artist:[th.sub],badge:[th.accent],fav:[th.accent],queue:[th.sub],progress:[th.accent,th.sub],controls:[th.text,th.accent],volume:[th.accent,th.sub],spectrum:[th.accent,th.accent2]};
  return (m[id]&&m[id][n-1])||'#ffffff';
}
const ec=(id,L,n)=>L['c'+n]||defCol(id,n);
const isLight=()=>lumin(S.theme.bg1)>.6;

function drawPanel(ctx,L,c){
  const w=L.w,hh=L.h,r=L.radius||40,col1=ec('panel',L,1),col2=ec('panel',L,2);

function drawCards(ctx,L,c){
  const cards=S.cards;if(!cards||!cards.length)return;
  const N=cards.length,prog=c.dur>0?clamp(c.t/c.dur,0,1-.0001):0;
  const exact=prog*N,activeIdx=Math.floor(exact),rem=exact-activeIdx;
  const slide=rem>.82?easeOut((rem-.82)/.18):0;
  const center=activeIdx+slide;
  const order=cards.map((cd,i)=>({cd,i,d:i-center})).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  const cw=400,ch=490,sp=L.spread||220;
  for(const it of order){
    const d=it.d,absD=Math.abs(d);if(absD>3.2)continue;
    const sc=Math.pow(.84,absD),tx=d*sp*Math.pow(.9,absD),ty=absD*18,rot=d*(L.rot||6)*Math.PI/180;
    ctx.save();
    ctx.translate(tx,ty);ctx.rotate(rot);ctx.scale(sc,sc);
    ctx.globalAlpha=clamp(1-absD*.22,.15,1);
    ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=36*c.sk;ctx.shadowOffsetY=16*c.sk;
    const gr=ctx.createLinearGradient(0,-ch/2,0,ch/2);
    gr.addColorStop(0,'rgba(75,65,68,.92)');gr.addColorStop(1,'rgba(38,32,35,.96)');
    ctx.fillStyle=gr;rr(ctx,-cw/2,-ch/2,cw,ch,34);ctx.fill();
    ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    ctx.lineWidth=2.5;ctx.strokeStyle='rgba(255,255,255,.22)';rr(ctx,-cw/2,-ch/2,cw,ch,34);ctx.stroke();
    const pad=14,iw=cw-pad*2,ih=iw;
    ctx.save();rr(ctx,-iw/2,-ch/2+pad,iw,ih,24);ctx.clip();
    coverFit(ctx,it.cd.img||coverImg,-iw/2,-ch/2+pad,iw,ih);
    ctx.restore();
    ctx.fillStyle='#ffffff';ctx.font=`700 28px ${stack(S.theme.font)}`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(it.cd.title||S.meta.title,0,ch/2-58);
    ctx.fillStyle='rgba(255,255,255,.68)';ctx.font=`400 20px ${stack(S.theme.font)}`;
    ctx.fillText(it.cd.artist||S.meta.artist,0,ch/2-26);
    ctx.restore();
  }
}

function drawRing(ctx,c,r0,col1,col2,N){
  const g=Math.max(.4,S.beatGain);ctx.save();ctx.lineCap='round';ctx.lineWidth=9;
  for(let i=0;i<N;i++){
    const half=N/2,j=i<half?i:N-1-i,lv=c.level(j/half),len=10+lv*110*g,a=i/N*Math.PI*2-Math.PI/2,co=Math.cos(a),si=Math.sin(a);
    ctx.strokeStyle=mixHex(col1,col2,Math.abs(i/N*2-1));ctx.globalAlpha=.55+.45*lv;
    ctx.beginPath();ctx.moveTo(co*r0,si*r0);ctx.lineTo(co*(r0+len),si*(r0+len));ctx.stroke();
  }
  ctx.restore();
}

function drawCover(ctx,L,c){
  const R=350,shape=L.shape,pl=1+.035*(L.pulse||0)*c.beat*S.beatGain;
  const col1=ec('cover',L,1),col2=ec('cover',L,2);
  ctx.scale(pl,pl);

  // Rotating smooth light effect behind thumbnail
  if(L.halo!==false){
    const hSpd=L.haloSpd==null?.4:L.haloSpd,hSz=(L.haloSize||1.25)*R,hBlur=(L.haloBlur==null?45:L.haloBlur)*c.sk;
    ctx.save();
    ctx.rotate(c.t*hSpd);
    if(hBlur>0&&'filter' in ctx)ctx.filter=`blur(${hBlur}px)`;
    ctx.globalAlpha=.68;
    const g1=ctx.createRadialGradient(-R*.32,-R*.32,10,-R*.2,-R*.2,hSz*.95);
    g1.addColorStop(0,col1);g1.addColorStop(.55,rgba(col2,.45));g1.addColorStop(1,rgba(col1,0));
    ctx.fillStyle=g1;ctx.beginPath();ctx.arc(-R*.2,-R*.2,hSz*.95,0,7);ctx.fill();
    const g2=ctx.createRadialGradient(R*.32,R*.32,10,R*.2,R*.2,hSz*.95);
    g2.addColorStop(0,col2);g2.addColorStop(.55,rgba(col1,.45));g2.addColorStop(1,rgba(col2,0));
    ctx.fillStyle=g2;ctx.beginPath();ctx.arc(R*.2,R*.2,hSz*.95,0,7);ctx.fill();
    if('filter' in ctx)ctx.filter='none';
    ctx.restore();
  }

  if(L.ring)drawRing(ctx,c,R+30,col1,col2,72);

  if(shape==='blob'){
    for(let b=2;b>=0;b--){
      ctx.save();ctx.rotate(c.t*(.22+b*.08)*(b%2?-1:1)*(L.haloSpd==null?1:L.haloSpd));
      const br=R*(1.05+b*.045);ctx.beginPath();
      for(let a=0;a<=64;a++){
        const th=a/64*Math.PI*2,rad=br+Math.sin(th*3+c.t*1.6+b)*24+Math.cos(th*2-c.t*1.1+b)*16;
        const x=Math.cos(th)*rad,y=Math.sin(th)*rad;a===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.closePath();ctx.fillStyle=b===0?rgba(col1,.55):b===1?rgba(col2,.38):rgba(col1,.22);ctx.fill();ctx.restore();
    }
  }

  if(shape==='sleeve'){
    ctx.save();ctx.translate(R*.58,0);ctx.rotate(c.t*.6*(L.spin==null?.5:L.spin));
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(0,0,R*.92,0,7);ctx.fill();
    ctx.fillStyle='#121316';ctx.beginPath();ctx.arc(0,0,R*.78,0,7);ctx.fill();
    ctx.fillStyle='#f5b041';ctx.beginPath();ctx.arc(0,0,R*.22,0,7);ctx.fill();
    ctx.restore();
  }

  const path=()=>{ctx.beginPath();if(shape==='round'||shape==='sleeve')rr(ctx,-R,-R,R*2,R*2,L.radius);else ctx.arc(0,0,R,0,Math.PI*2)};
  ctx.save();ctx.shadowColor=isLight()?'rgba(0,0,0,.25)':rgba(col1,.35);ctx.shadowBlur=45*c.sk;ctx.shadowOffsetY=18*c.sk;ctx.fillStyle='#000';path();ctx.fill();ctx.restore();
  if(shape==='vinyl'){
    ctx.save();ctx.rotate(c.t*.5*(L.spin==null?.5:L.spin));
    const rg=ctx.createRadialGradient(0,0,40,0,0,R);rg.addColorStop(0,'#1b1b1f');rg.addColorStop(1,'#050506');ctx.fillStyle=rg;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
    ctx.lineWidth=1.5;for(let r=235;r<R-6;r+=11){ctx.strokeStyle=`rgba(255,255,255,${.035+.03*rnd(r)})`;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke()}
    ctx.save();ctx.beginPath();ctx.arc(0,0,215,0,7);ctx.clip();coverFit(ctx,coverImg,-215,-215,430,430);ctx.restore();
    ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.arc(0,0,215,0,7);ctx.stroke();
    ctx.fillStyle=S.theme.bg2;ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();
    ctx.restore();
  }else{
    ctx.save();path();ctx.clip();coverFit(ctx,coverImg,-R,-R,R*2,R*2);ctx.restore();
    ctx.lineWidth=2;ctx.strokeStyle='rgba(255,255,255,.16)';path();ctx.stroke();
  }
}

function drawLineText(ctx,txt,L,col,c){
  const fs0=L.fs;ctx.font=`${L.weight} ${fs0}px ${stack(S.theme.font)}`;
  let fs=fs0;const w=ctx.measureText(txt).width;
  if(w>L.w){fs=fs0*L.w/w;ctx.font=`${L.weight} ${fs}px ${stack(S.theme.font)}`}
  ctx.save();
  const anim=L.anim||'none',t=c?c.t:0;
  if(anim==='wave')ctx.translate(0,Math.sin(t*3)*8);
  else if(anim==='shimmer'){ctx.shadowColor=S.theme.accent;ctx.shadowBlur=(12+10*Math.sin(t*4))*(c?c.sk:1)}

  ctx.fillText(txt,L.align==='left'?-L.w/2:L.align==='right'?L.w/2:0,0);

}

}
function drawControls(ctx,L,c){

function drawVolume(ctx,L,c){
  const w=L.w,A=ec('volume',L,1),B=L.c2||rgba(S.theme.sub,.3),v=clamp(S.meta.volume,0,1),x0=-w/2+74,x1=w/2-74,kx=lerp(x0,x1,v);
  icon(ctx,'volOff',-w/2+22,0,46,S.theme.sub);icon(ctx,'volUp',w/2-22,0,46,S.theme.sub);
  ctx.fillStyle=B;rr(ctx,x0,-3,x1-x0,6,3);ctx.fill();ctx.fillStyle=A;rr(ctx,x0,-3,kx-x0,6,3);ctx.fill();
  ctx.save();ctx.shadowColor=A;ctx.shadowBlur=14*c.sk;ctx.fillStyle=A;ctx.beginPath();ctx.arc(kx,0,13,0,7);ctx.fill();ctx.restore();

function drawProgress(ctx,L,c){
  const th=S.theme,w=L.w,prog=c.dur>0?clamp(c.t/c.dur,0,1):0,A=ec('progress',L,1),B=L.c2||rgba(th.sub,.35),cy=-24;
  const maxH=L.h||75,n=L.n||Math.max(20,Math.round(w/11)),thick=L.thick||5;
  const grad=ctx.createLinearGradient(-w/2,0,w/2,0);grad.addColorStop(0,A);grad.addColorStop(1,th.accent2||A);
  const activeFill=L.grad?grad:A;

  if(L.mode==='line'){
    ctx.fillStyle=B;rr(ctx,-w/2,cy-thick/2,w,thick,thick/2);ctx.fill();
    ctx.fillStyle=activeFill;rr(ctx,-w/2,cy-thick/2,Math.max(thick,w*prog),thick,thick/2);ctx.fill();
    ctx.save();ctx.shadowColor=A;ctx.shadowBlur=14*c.sk;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-w/2+w*prog,cy,thick*1.8+4,0,7);ctx.fill();ctx.restore();
  }else if(L.mode==='wave'){

    for(let pass=0;pass<2;pass++){
      ctx.save();ctx.beginPath();
      if(pass===0){ctx.rect(-w/2,cy-maxH,w*prog,maxH*2);ctx.clip();ctx.strokeStyle=activeFill}
      else{ctx.rect(-w/2+w*prog,cy-maxH,w*(1-prog),maxH*2);ctx.clip();ctx.strokeStyle=B}
      for(let i=0;i<=n;i++){

        const lv=L.react==='static'?barPeaks(n+1)[i]:(c.level(Math.abs(fr*2-1))*.8+c.beat*.25);
        const y=cy+Math.sin(i*.9+c.t*10)*lv*(maxH*.65);
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      }
      ctx.stroke();ctx.restore();
    }
  }else if(L.mode==='circle'){
    // Radial Circle Music Bars
    const R=maxH*.9,bars=Math.min(96,n);
    ctx.save();ctx.translate(0,cy);ctx.lineCap='round';ctx.lineWidth=thick;
    for(let i=0;i<bars;i++){

      const lv=L.react==='static'?barPeaks(bars)[i]:(c.level(Math.abs(fr*2-1))*.85+c.beat*.3*Math.sin(i+c.t*8));
      const len=6+clamp(lv,0.08,1.3)*maxH*.75;
      ctx.strokeStyle=fr<=prog?(L.grad?mixHex(A,th.accent2||A,fr):A):B;
      ctx.beginPath();ctx.moveTo(Math.cos(ang)*R,Math.sin(ang)*R);ctx.lineTo(Math.cos(ang)*(R+len),Math.sin(ang)*(R+len));ctx.stroke();
    }

      const fr=i/(n-1),symFr=Math.abs(2*fr-1),base=pk[i];
      let mag;
      if(L.react==='static')mag=base;

        const wave=0.5+0.5*Math.sin(i*.55-c.t*9);

      const topY=L.mode==='mirror'?(cy-hgt/2):(cy+maxH/2-hgt);
      if(isHead){ctx.save();ctx.shadowColor=A;ctx.shadowBlur=14*c.sk;rr(ctx,x-wd/2,topY,wd,hgt,wd/2);ctx.fill();ctx.restore()}
      else{rr(ctx,x-wd/2,topY,wd,hgt,wd/2);ctx.fill()}
    }
  }
  if(L.time){
    ctx.font=`400 28px ${stack(th.font)}`;ctx.fillStyle=th.sub;ctx.textBaseline='middle';
    ctx.textAlign='left';ctx.fillText(fmtMS(c.t),-w/2,cy+maxH/2+36);ctx.textAlign='right';ctx.fillText('-'+fmtMS(Math.max(0,c.dur-c.t)),w/2,cy+maxH/2+36);
  }
}

function drawSpectrum(ctx,L,c){
  const n=L.n||56,w=L.w,hh=L.h||300,gx=(L.gain==null?1.2:L.gain),c1=ec('spectrum',L,1),c2=ec('spectrum',L,2);
  const gr=ctx.createLinearGradient(-w/2,0,w/2,0);gr.addColorStop(0,c1);gr.addColorStop(1,L.grad===false?c1:c2);
  ctx.fillStyle=gr;ctx.strokeStyle=gr;
  const pitch=w/n,bw=clamp(L.thick||pitch*.62,2,pitch*.92),pts=[];
  if(L.mode==='circle'){
    const R=L.radius||180;ctx.save();ctx.lineCap='round';ctx.lineWidth=L.thick||6;
    for(let i=0;i<n;i++){
      const fr=L.sym?Math.abs(2*i/(n-1)-1):i/(n-1);
      const lv=c.level(fr)+c.beat*.22*Math.abs(Math.sin(i*.5+c.t*8));
      const len=8+clamp(lv*gx,0,1.4)*(hh*.55),a=i/n*Math.PI*2-Math.PI/2;
      ctx.strokeStyle=L.grad===false?c1:mixHex(c1,c2,fr);
      ctx.beginPath();ctx.moveTo(Math.cos(a)*R,Math.sin(a)*R);ctx.lineTo(Math.cos(a)*(R+len),Math.sin(a)*(R+len));ctx.stroke();
    }
    ctx.restore();return;
  }
  for(let i=0;i<n;i++){
    const fr=L.sym?Math.abs(2*i/(n-1)-1):i/(n-1);
    const lv=c.level(fr)+c.beat*.2*Math.abs(Math.sin(i*.4-c.t*7));
    const hg=clamp(8+lv*gx*(hh-8),8,hh),x=-w/2+i*pitch+pitch/2;
    if(L.mode==='mirror'){rr(ctx,x-bw/2,-hg/2,bw,hg,bw/2);ctx.fill()}
    else if(L.mode==='line')pts.push([x,hh/2-hg]);
    else{rr(ctx,x-bw/2,hh/2-hg,bw,hg,bw/2);ctx.fill()}
  }
  if(L.mode==='line'){ctx.lineWidth=L.thick||6;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke()}
}

let bgCache={key:'',cv:null};
function bgCanvas(img,ver,W,H){
  const key=`${S.bgMode}|${ver}|${S.bgBlur}|${W}x${H}`;if(bgCache.key===key)return bgCache.cv;

/* ===================================================================
   CAPTION LOGIC
   =================================================================== */
const sortCaps=()=>S.captions.sort((a,b)=>(a.track||0)-(b.track||0)||a.start-b.start);
const capById=id=>S.captions.find(c=>c.id===id);
function fillGaps(){
  if(!S.autoFill)return;sortCaps();
  for(let tr=0;tr<(S.capTracks||1);tr++){
    const list=S.captions.filter(c=>(c.track||0)===tr).sort((a,b)=>a.start-b.start);
    for(let i=0;i<list.length-1;i++){const a=list[i],b=list[i+1],g=b.start-a.end;if(g>.001&&g<=S.maxGap)a.end=b.start}
  }
}
function placeCap(cap,s,e,keepLen){
  const tr=cap.track||0;
  const sorted=S.captions.filter(c=>(c.track||0)===tr).sort((a,b)=>a.start-b.start),i=sorted.indexOf(cap),prev=sorted[i-1],next=sorted[i+1];
  const lo=prev?prev.start+MIN:0,hi=next?next.end-MIN:Math.max(S.duration,e);
  if(keepLen){const len=e-s;s=clamp(s,lo,Math.max(lo,hi-len));e=s+len}
  else{s=clamp(s,lo,e-MIN);e=clamp(e,s+MIN,hi)}

  if(prev&&prev.end>s)prev.end=s;
  if(next&&next.start<e)next.start=e;
  fillGaps();
}
function addCaption(at,text,trackIdx){
  pushUndo();
  sortCaps();let t=at==null?F.t:at,tr=trackIdx==null?0:trackIdx;
  const trCaps=S.captions.filter(c=>(c.track||0)===tr);
  const inside=trCaps.find(c=>t>=c.start&&t<c.end);if(inside)t=inside.end;
  const next=trCaps.find(c=>c.start>t);
  let end=Math.min(t+3,next?next.start:S.duration);
  if(end-t<MIN){toast('No room on this track – try another caption track or move playhead');return null}
  const cap={id:uid(),track:tr,start:t,end,text:text||'New lyric line',anim:'inherit'};
  S.captions.push(cap);fillGaps();S.sel={type:'cap',id:cap.id};afterCapEdit(true);return cap;
}

/* ---------- Caption Copy, Multi-Selection & Duplicate Logic ---------- */
let CAP_CLIPBOARD = [];

function getSelectedCaps(){
  if(S.selectedCaps && S.selectedCaps.size > 0){
    return S.captions.filter(c => S.selectedCaps.has(c.id));
  }
  if(S.sel.type === 'cap'){
    const c = capById(S.sel.id);
    return c ? [c] : [];
  }
  return [];
}

function copySelectedCaps(){
  const targets = getSelectedCaps();
  if(!targets.length){ toast('Select caption(s) to copy'); return; }
  CAP_CLIPBOARD = JSON.parse(JSON.stringify(targets));
  toast(`Copied ${targets.length} caption(s)`);
}

/* ---------- Collision-Free Insert, Ripple & Multi-Track Duplicate ---------- */
function rippleShiftCaptions(fromTime, durationToAdd, targetTrack) {
  S.captions.forEach(c => {
    if ((c.track || 0) === targetTrack && c.start >= fromTime - 0.05) {
      c.start += durationToAdd;
      c.end += durationToAdd;
    }
  });
}

function pasteCaps(atTime){
  if (!CAP_CLIPBOARD.length) { toast('Clipboard is empty'); return; }
  pushUndo();
  const sorted = [...CAP_CLIPBOARD].sort((a,b) => a.start - b.start);
  const baseStart = sorted[0].start;
  const insertTime = atTime != null ? atTime : F.t;
  const totalSpan = sorted[sorted.length - 1].end - baseStart;
  const targetTrack = sorted[0].track || 0;

  // Ripple shift all existing captions at or after insertion point to guarantee NO overlap
  rippleShiftCaptions(insertTime, totalSpan + 0.1, targetTrack);

  const newCaps = [];
  S.selectedCaps.clear();

  sorted.forEach(item => {
    const dur = item.end - item.start;
    const relOffset = item.start - baseStart;
    const nStart = insertTime + relOffset;
    const nEnd = nStart + dur;
    const cloned = {
      ...JSON.parse(JSON.stringify(item)),
      id: uid(),
      start: nStart,
      end: nEnd,
      track: targetTrack
    };
    S.captions.push(cloned);
    newCaps.push(cloned);
    S.selectedCaps.add(cloned.id);
  });

  sortCaps();
  if (newCaps.length > 0) S.sel = { type: 'cap', id: newCaps[0].id };
  afterCapEdit(true);
  toast(`Pasted ${newCaps.length} caption(s) without overlap`);
  triggerAutoSave();
}

function duplicateSelectedCaps(){
  const targets = getSelectedCaps();
  if (!targets.length) { toast('Select caption(s) to duplicate'); return; }
  pushUndo();
  const sorted = [...targets].sort((a,b) => a.start - b.start);
  const insertTime = F.t > sorted[sorted.length-1].end ? F.t : sorted[sorted.length - 1].end + 0.05;
  const totalSpan = sorted[sorted.length - 1].end - sorted[0].start;
  const targetTrack = sorted[0].track || 0;

  // Insert ripple shift to prevent overlap
  rippleShiftCaptions(insertTime, totalSpan + 0.1, targetTrack);

  const newCaps = [];
  S.selectedCaps.clear();

  sorted.forEach(c => {
    const dur = c.end - c.start;
    const relOffset = c.start - sorted[0].start;
    const cloned = {
      ...JSON.parse(JSON.stringify(c)),
      id: uid(),
      start: insertTime + relOffset,
      end: insertTime + relOffset + dur,
      track: targetTrack
    };
    S.captions.push(cloned);
    newCaps.push(cloned);
    S.selectedCaps.add(cloned.id);
  });

  sortCaps();
  if (newCaps.length > 0) S.sel = { type: 'cap', id: newCaps[0].id };
  afterCapEdit(true);
  toast(`Duplicated ${newCaps.length} caption(s) cleanly`);
  triggerAutoSave();
}


function splitAt(t){
  let cap=(S.sel.type==='cap'?capById(S.sel.id):null);
  if(!cap||t<=cap.start+MIN||t>=cap.end-MIN)cap=S.captions.find(c=>t>c.start+MIN&&t<c.end-MIN);
  if(!cap){toast('Place the playhead inside a caption to split');return}
  pushUndo();
  const words=cap.text.trim().split(/\s+/).filter(Boolean),ratio=(t-cap.start)/(cap.end-cap.start);
  let k=words.length>1?clamp(Math.round(words.length*ratio),1,words.length-1):words.length;
  const a=words.slice(0,k).join(' '),b=words.length>1?words.slice(k).join(' '):'';
  const n={
    id:uid(),
    track:cap.track||0,
    start:t,
    end:cap.end,
    text:b,
    anim:cap.anim,
    freezeIn:cap.freezeIn!=null?Math.min(cap.freezeIn,(cap.end-t)*0.35):null,
    freezeOut:cap.freezeOut!=null?Math.min(cap.freezeOut,(cap.end-t)*0.35):null
  };
  cap.end=t;
  cap.text=a;
  if(cap.freezeOut!=null)cap.freezeOut=Math.min(cap.freezeOut,(t-cap.start)*0.35);
  S.captions.push(n);sortCaps();S.sel={type:'cap',id:n.id};afterCapEdit(true);toast('Split at '+fmtT(t,2));
}
function deleteSel(){
  pushUndo();
  const toDelete = getSelectedCaps();
  if(toDelete.length > 0){
    const delIds = new Set(toDelete.map(c=>c.id));
    S.captions = S.captions.filter(c => !delIds.has(c.id));
    S.selectedCaps.clear();
    fillGaps();
    S.sel = {type:'el', id:'lyrics'};
    afterCapEdit(true);
    triggerAutoSave();

/* ---------- Enhanced Multi-Language & 3-Part Timecode LRC Parser ---------- */
function parseTimestampToSeconds(tsStr) {
  const clean = tsStr.trim().replace(/,/g, '.');
  const parts = clean.split(':');
  if (parts.length === 3) {
    // [HH:MM:SS.ms] or [00:00:11.20]
    return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
  } else if (parts.length === 2) {
    // [MM:SS.ms]
    return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
  }
  return parseFloat(clean) || 0;
}

function parseLyrics(txt, replace){
  pushUndo();
  const lines = txt.split(/\r?\n/);
  // Matches all timestamp formats: [00:11.20], [00:00:11.20], [00:00:11.200], [00:00:11,200]
  const bracketRegex = /\[(\d{1,2}:(?:[0-5]?\d):(?:\d{2})(?:[.:]\d{1,3})?|\d{1,2}:(?:\d{2})(?:[.:]\d{1,3})?)\]/g;
  const timedItems = [];
  const plainTextLines = [];

  for (const rawLine of lines) {
    const trimmed = rawLine.trim();
    if (!trimmed) continue;

    const matches = [...trimmed.matchAll(bracketRegex)];
    if (matches.length > 0) {
      // Remove timestamp tag to extract actual lyrics
      const cleanLyricText = trimmed.replace(bracketRegex, '').trim();
      
      // CRITICAL: If line has no text (e.g. "[00:00:00.00]"), skip adding an empty layer
      if (!cleanLyricText) continue;

      for (const m of matches) {
        const seconds = parseTimestampToSeconds(m[1]);
        timedItems.push({ start: seconds, text: cleanLyricText });
      }
    } else {
      plainTextLines.push(trimmed);
    }
  }

  let finalCaptions = [];

  if (timedItems.length > 0) {
    // Sort chronologically by start timestamp
    timedItems.sort((a, b) => a.start - b.start);

    for (let i = 0; i < timedItems.length; i++) {
      const cur = timedItems[i];
      // Automatically end when the next lyric line begins
      const nextStart = (i < timedItems.length - 1) ? timedItems[i + 1].start : (cur.start + 3.5);
      const safeEnd = Math.max(cur.start + 0.3, nextStart);

      finalCaptions.push({
        id: uid(),
        track: 0,
        start: cur.start,
        end: safeEnd,
        text: cur.text,
        anim: 'inherit',
        freezeIn: 0.15,
        freezeOut: 0.15
      });
    }

    // Automatically expand timeline duration if lyrics extend further
    const lastCap = finalCaptions[finalCaptions.length - 1];
    if (lastCap && lastCap.end > S.duration) {
      S.duration = Math.ceil(lastCap.end + 2);
      $('#lenIn').value = Math.round(S.duration);
    }
  } else if (plainTextLines.length > 0) {
    // Fallback: Evenly space lines across song duration
    const count = plainTextLines.length;
    const durPerLine = S.duration / count;
    plainTextLines.forEach((t, i) => {
      finalCaptions.push({
        id: uid(),
        track: 0,
        start: i * durPerLine,
        end: (i + 1) * durPerLine,
        text: t,
        anim: 'inherit',
        freezeIn: 0.15,
        freezeOut: 0.15
      });
    });
  }

  if (!finalCaptions.length) {
    toast('No valid lyric lines found in pasted text');
    return;
  }

  if (replace) {
    S.captions = finalCaptions;
  } else {
    S.captions.push(...finalCaptions);
  }

  sortCaps();
  fillGaps();
  if (finalCaptions.length > 0) S.sel = { type: 'cap', id: finalCaptions[0].id };
  sizeTimeline();
  afterCapEdit(true);
  toast(`Imported ${finalCaptions.length} lyric lines successfully!`);
  triggerAutoSave();
}

/* ---------- Universal Multi-Aspect Template & Layout Engine ---------- */
/* ---------- Universal Multi-Aspect Template & Layout Engine ---------- */
function getTemplateLayoutForAspect(tplId, aspect) {
  const T = TPLS[tplId] || TPLS.aurora;
  const tL = T.L || AURORA_L;
  
  if (tL && tL[aspect]) return makeLayout(tL[aspect]);

  const isWide = (aspect === '16:9');
  const baseRef = (tL && (isWide ? tL['16:9'] : tL['9:16'])) || AURORA_L[isWide ? '16:9' : '9:16'];
  const generated = makeLayout(baseRef);

  // Proportional re-centering & scaling adjustments for 1:1, 4:5, 3:4 so elements NEVER overlap
  for (const id of ORDER) {
    const item = generated[id];
    if (!item) continue;

    if (aspect === '1:1') { // 1080 x 1080 Square
      if (id === 'cover') { item.y = 0.28; item.s = 0.52; }
      else if (id === 'title') { item.y = 0.52; item.fs = 38; item.w = 720; }
      else if (id === 'artist') { item.y = 0.57; item.fs = 26; item.w = 720; }
      else if (id === 'progress') { item.y = 0.66; item.w = 700; item.h = 45; }
      else if (id === 'controls') { item.y = 0.77; item.w = 580; item.s = 0.85; }
      else if (id === 'volume') { item.y = 0.96; item.w = 640; item.s = 0.85; }
      else if (id === 'lyrics') { item.y = 0.87; item.w = 840; }
      else if (id === 'panel') { item.w = 860; item.h = 880; item.y = 0.5; }
      else if (id === 'badge') { item.y = 0.08; item.fs = 24; }
      else if (id === 'fav' || id === 'queue') { item.y = 0.54; item.size = 52; }
    } else if (aspect === '4:5' || aspect === '3:4') { // 1080 x 1350 and 1080 x 1440
      if (id === 'cover') { item.y = 0.28; item.s = 0.68; }
      else if (id === 'title') { item.y = 0.50; item.fs = 46; item.w = 800; }
      else if (id === 'artist') { item.y = 0.55; item.fs = 32; item.w = 800; }
      else if (id === 'progress') { item.y = 0.64; item.w = 780; }
      else if (id === 'controls') { item.y = 0.75; item.w = 680; item.s = 0.9; }
      else if (id === 'volume') { item.y = 0.84; item.w = 760; }
      else if (id === 'lyrics') { item.y = 0.92; item.w = 900; }
      else if (id === 'panel') { item.w = 900; item.h = 920; item.y = 0.5; }
    }
  }
  return generated;
}

function applyTemplate(id){
  const T = TPLS[id];
  if (!T) return;
  pushUndo();
  S.tpl = id;
  Object.assign(S.theme, T.theme);
  S.bgMode = T.bgMode;
  S.bgBlur = T.bgBlur == null ? 40 : T.bgBlur;
  S.bgDim = T.bgDim == null ? 0.45 : T.bgDim;
  Object.assign(S.cap, { lineH: 1.25, strokeW: 0 }, T.cap);

  // Initialize ALL supported aspect dimensions
  S.layout = {};
  Object.keys(DIM).forEach(asp => {
    S.layout[asp] = getTemplateLayoutForAspect(id, asp);
  });

  ensureFont(S.theme.font);
  ensureFont(S.cap.font);
  const selEl = $('#tplSel');
  if (selEl) selEl.value = id;

  layCache.clear();
  fitCanvas();
  renderPanel();
  triggerAutoSave();
}

function setAspect(a){
  pushUndo();
  S.aspect = a;
  if (!S.layout) S.layout = {};
  if (!S.layout[a]) {
    S.layout[a] = getTemplateLayoutForAspect(S.tpl, a);
  }
  [...$('#aspectSeg').children].forEach(b => b.classList.toggle('on', b.dataset.a === a));
  layCache.clear();
  fitCanvas();
  renderPanel();
  triggerAutoSave();
}

const EX={fmt:0,res:'1080',fps:'30',mbps:16,mute:false};
const CANDS=[['MP4 · H.264 + AAC','video/mp4;codecs=avc1.640028,mp4a.40.2','mp4'],['MP4 (browser default codec)','video/mp4','mp4'],['WebM · VP9 + Opus (high quality)','video/webm;codecs=vp9,opus','webm'],['WebM · AV1 + Opus','video/webm;codecs=av01,opus','webm'],['WebM · VP8 + Opus','video/webm;codecs=vp8,opus','webm'],['WebM (default)','video/webm','webm']];
const SUPPORT=(typeof MediaRecorder!=='undefined'?CANDS.filter(c=>{try{return MediaRecorder.isTypeSupported(c[1])}catch(e){return false}}):[]).map(c=>({label:c[0],mime:c[1],ext:c[2]}));
let exporting=false,exportState=null;
async function doExport(){
  if(exporting)return;

  const fm=SUPPORT[+EX.fmt]||SUPPORT[0];
  try{ensureCtx();await actx.resume()}catch(e){}

  pause();seek(0);F.t=0;F.beat=0;
  render(ectx,ecv.width/W,false);
  const stream=ecv.captureStream(+EX.fps);
  if(hasAudio&&recDest)recDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  let rec;
  try{rec=new MediaRecorder(stream,{mimeType:fm.mime,videoBitsPerSecond:EX.mbps*1e6,audioBitsPerSecond:192000})}
  catch(e){try{rec=new MediaRecorder(stream)}catch(e2){toast('Could not start the recorder');return}}
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  exportState={rec,chunks,fm,cancelled:false,name:(S.meta.title||'lyric-video').replace(/[^\w\-]+/g,'_')};
  rec.onstop=()=>{
    const st=exportState;exporting=false;if(monGain)monGain.gain.value=+$('#monVol').value;closeModal();pause();
    if(st&&!st.cancelled&&chunks.length){download(new Blob(chunks,{type:fm.mime.split(';')[0]}),st.name+'.'+fm.ext);toast('Export finished · '+(chunks.reduce((a,c)=>a+c.size,0)/1048576).toFixed(1)+' MB')}
    exportState=null;
  };
  exporting=true;if(monGain&&EX.mute)monGain.gain.value=0;
  openModal(h('div',null,h('h3',{text:'Exporting video…'}),h('div',{id:'expInfo',class:'mut',text:`${ecv.width}×${ecv.height} · ${EX.fps} fps · ${EX.mbps} Mbps · ${fm.label}`}),h('div','bar',h('i',{id:'expBar'})),h('div',{id:'expTxt',text:'0%'}),h('div','row2',h('button',{class:'btn danger',text:'Cancel',onclick:()=>{if(exportState){exportState.cancelled=true;try{rec.stop()}catch(e){}}}}))),true);
  rec.start(500);play();
}

/* ---------- Auto-Save to Browser Storage (localStorage) ---------- */
const AUTOSAVE_KEY = 'lyric_video_studio_autosave_v1';
let autoSaveTimer = null;

function triggerAutoSave(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(saveToLocalStorage, 400);
}

function saveToLocalStorage(){
  try {
    const payload = {
      version: 1,
      aspect: S.aspect,
      tpl: S.tpl,
      theme: S.theme,
      bgMode: S.bgMode,
      bgBlur: S.bgBlur,
      bgDim: S.bgDim,
      meta: S.meta,
      layout: S.layout,
      uiGroup: S.uiGroup,
      cap: S.cap,
      capTracks: S.capTracks,
      captions: S.captions,
      overlays: S.overlays,
      autoFill: S.autoFill,
      maxGap: S.maxGap,
      duration: S.duration,
      audioTrim: S.audioTrim,
      timestamp: Date.now()
    };
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(payload));
  } catch(e) {
    console.warn('Auto-save failed:', e);
  }
}

function restoreFromLocalStorage(){
  try {
    const saved = localStorage.getItem(AUTOSAVE_KEY);
    if(!saved) return false;
    const d = JSON.parse(saved);
    if(!d || !d.captions) return false;

    Object.assign(S, {
      aspect: d.aspect || '9:16',
      tpl: d.tpl || S.tpl,
      bgMode: d.bgMode || S.bgMode,
      bgBlur: d.bgBlur != null ? d.bgBlur : S.bgBlur,
      bgDim: d.bgDim != null ? d.bgDim : S.bgDim,
      layout: d.layout || S.layout,
      uiGroup: d.uiGroup || {x:0,y:0,s:1,rot:0,lockDrag:false},
      capTracks: d.capTracks || 2,
      captions: d.captions || [],
      overlays: d.overlays || [],
      autoFill: d.autoFill != null ? d.autoFill : true,
      maxGap: d.maxGap != null ? d.maxGap : 30,
      duration: d.duration || 32,
      audioTrim: d.audioTrim || {start:0, end: d.duration || 32}
    });
    if(d.theme) Object.assign(S.theme, d.theme);
    if(d.meta) Object.assign(S.meta, d.meta);
    if(d.cap) Object.assign(S.cap, d.cap);

    setAspect(S.aspect);
    syncToolbar();
    buildTimeline();
    renderPanel();
    updateAudioTrimVisuals();
    toast('Restored session from browser auto-save');
    return true;
  } catch(e) {
    console.warn('Could not restore auto-save:', e);
    return false;
  }
}

window.addEventListener('beforeunload', (e) => {
  saveToLocalStorage();
});

/* ---------- Full Song Visual Audio Trimmer Modal ---------- */
function openVisualTrimModal() {
  const totalAudDur = (hasAudio && isFinite(aud.duration) && aud.duration > 0) ? aud.duration : S.duration;
  let curStart = S.audioTrim?.start || 0;
  let curEnd = S.audioTrim?.end || Math.min(totalAudDur, curStart + S.duration);

  const canvasW = 500, canvasH = 90;
  const cv = h('canvas', { width: canvasW, height: canvasH, style: 'width:100%;height:90px;background:#0d1117;border-radius:6px;display:block;' });
  const g = cv.getContext('2d');

  const drawFullWave = () => {
    g.clearRect(0, 0, canvasW, canvasH);
    if (S.peaks && totalAudDur > 0) {
      const P = S.peaks, N = P.length;
      g.fillStyle = '#4a5568';
      for (let x = 0; x < canvasW; x++) {
        const tAud = (x / canvasW) * totalAudDur;
        const idx = Math.floor((tAud / totalAudDur) * N);
        const hh = Math.max(2, (P[idx] || 0) * (canvasH - 10));
        g.fillRect(x, (canvasH - hh) / 2, 1, hh);
      }

      // Highlight selected trim window in green
      const x0 = (curStart / totalAudDur) * canvasW;
      const x1 = (curEnd / totalAudDur) * canvasW;
      g.fillStyle = 'rgba(45, 226, 176, 0.25)';
      g.fillRect(x0, 0, x1 - x0, canvasH);

      g.fillStyle = '#2de2b0';
      for (let x = Math.floor(x0); x <= Math.ceil(x1); x++) {
        const tAud = (x / canvasW) * totalAudDur;
        const idx = Math.floor((tAud / totalAudDur) * N);
        const hh = Math.max(2, (P[idx] || 0) * (canvasH - 10));
        g.fillRect(x, (canvasH - hh) / 2, 1, hh);
      }

      // Border handles
      g.fillStyle = '#2de2b0';
      g.fillRect(x0 - 2, 0, 4, canvasH);
      g.fillRect(x1 - 2, 0, 4, canvasH);
    }
  };

  const infoTxt = h('div', { class: 'mut', style: 'font-size:12px;margin:8px 0;' }, 
    `Selected: ${fmtT(curStart, 1)} → ${fmtT(curEnd, 1)} (Duration: ${(curEnd - curStart).toFixed(1)}s)`
  );

  const startIn = h('input', { type: 'number', step: '0.1', value: curStart.toFixed(1), style: 'width:80px' });
  const endIn = h('input', { type: 'number', step: '0.1', value: curEnd.toFixed(1), style: 'width:80px' });

  const sync = () => {
    infoTxt.textContent = `Selected: ${fmtT(curStart, 1)} → ${fmtT(curEnd, 1)} (Duration: ${(curEnd - curStart).toFixed(1)}s)`;
    startIn.value = curStart.toFixed(1);
    endIn.value = curEnd.toFixed(1);
    drawFullWave();
  };

  startIn.onchange = () => { curStart = clamp(+startIn.value, 0, curEnd - 0.5); sync(); };
  endIn.onchange = () => { curEnd = clamp(+endIn.value, curStart + 0.5, totalAudDur); sync(); };

  // Click & drag selection directly on canvas
  let dragMode = null;
  cv.onpointerdown = e => {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * canvasW;
    const x0 = (curStart / totalAudDur) * canvasW;
    const x1 = (curEnd / totalAudDur) * canvasW;

    if (Math.abs(x - x0) < 15) dragMode = 's';
    else if (Math.abs(x - x1) < 15) dragMode = 'e';
    else dragMode = 'move';

    const onMove = ev => {
      const rx = (ev.clientX - r.left) / r.width;
      const t = clamp(rx * totalAudDur, 0, totalAudDur);
      if (dragMode === 's') curStart = Math.min(t, curEnd - 0.5);
      else if (dragMode === 'e') curEnd = Math.max(t, curStart + 0.5);
      sync();
    };

    const onUp = () => {
      removeEventListener('pointermove', onMove);
      removeEventListener('pointerup', onUp);
    };

    addEventListener('pointermove', onMove);
    addEventListener('pointerup', onUp);
  };

  setTimeout(drawFullWave, 50);

  openModal(h('div', null,
    h('h3', { text: '✂ Pick Audio Section' }),
    h('div', { class: 'hint', text: 'Drag the green region or handles to select which part of the song to use for your video.' }),
    cv,
    infoTxt,
    h('div', { style: 'display:flex;gap:12px;align-items:center;margin:10px 0;' },
      h('label', { class: 'mut' }, 'Start (s): ', startIn),
      h('label', { class: 'mut' }, 'End (s): ', endIn)
    ),
    h('div', 'row2',
      h('button', {
        class: 'btn primary',
        text: 'Apply Trim',
        onclick: () => {
          pushUndo();
          S.audioTrim = { start: curStart, end: curEnd };
          S.duration = Math.max(1, curEnd - curStart);
          $('#trimStartIn').value = curStart.toFixed(1);
          $('#trimEndIn').value = curEnd.toFixed(1);
          $('#lenIn').value = Math.round(S.duration);
          closeModal();
          seek(0);
          buildTimeline();
          toast(`Trim applied: ${fmtT(curStart, 1)} → ${fmtT(curEnd, 1)}`);
          triggerAutoSave();
        }
      }),
      h('button', { class: 'btn', text: 'Cancel', onclick: closeModal })
    )
  ));
}

$('#tGap').onchange=e=>{S.maxGap=Math.max(0,parseFloat(e.target.value)||0);fillGaps();renderClips()};
$('#tSnap').onchange=e=>{S.snap=e.target.checked};$('#tFollow').onchange=e=>{TL.follow=e.target.checked};
$('#tZoom').oninput=e=>{const mid=(tlScroll.scrollLeft+tlScroll.clientWidth/2)/TL.pps;TL.pps=clamp(4*Math.pow(300,+e.target.value/100),4,1200);sizeTimeline();tlScroll.scrollLeft=mid*TL.pps-tlScroll.clientWidth/2;drawTLCanvases()};
$('#tFit').onclick=()=>{setPps((tlScroll.clientWidth-30)/Math.max(1,S.duration));tlScroll.scrollLeft=0;drawTLCanvases()};
$('#aspectSeg').onclick=e=>{const a=e.target.dataset&&e.target.dataset.a;if(a)setAspect(a)};
$('#audioIn').onchange=e=>{if(e.target.files[0])loadAudioFile(e.target.files[0]);e.target.value=''};
$('#coverIn').onchange=e=>{if(e.target.files[0])loadCover(e.target.files[0]);e.target.value=''};
$('#bgTopIn').onchange=e=>{if(e.target.files[0])loadBgFile(e.target.files[0]);e.target.value=''};
$('#openIn').onchange=e=>{if(e.target.files[0])openProject(e.target.files[0]);e.target.value=''};
$('#bSave').onclick=saveProject;
$('#bExportTop').onclick=()=>{S.tab='export';renderPanel()};
(function(){const ts=$('#tplSel');Object.entries(TPLS).forEach(([k,v])=>ts.append(h('option',{value:k,text:v.name})));ts.onchange=()=>applyTemplate(ts.value)})();
view.addEventListener('pointerdown',()=>pushUndo(),{capture:true});
addEventListener('keydown',e=>{
  const tg=e.target.tagName,inField=tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT';
  if((e.ctrlKey||e.metaKey)&&!inField){
    if(e.key==='z'||e.key==='Z'){e.preventDefault();e.shiftKey?redo():undo();return}
    if(e.key==='y'||e.key==='Y'){e.preventDefault();redo();return}
    if(e.key==='c'||e.key==='C'){e.preventDefault();copySelectedCaps();return}
    if(e.key==='v'||e.key==='V'){e.preventDefault();pasteCaps(F.t);return}
    if(e.key==='d'||e.key==='D'){e.preventDefault();duplicateSelectedCaps();return}
  }
  if(e.code==='Space'&&!inField&&tg!=='BUTTON'){e.preventDefault();toggle();return}
  if(inField)return;
  if(e.key==='s'||e.key==='S'){splitAt(F.t)}
  else if(e.key==='Delete'||e.key==='Backspace'){deleteSel()}
  else if(S.sel.type==='el'&&e.key.startsWith('Arrow')){
    e.preventDefault();const L=curLayout(S.sel.id),[W,H]=DIM[S.aspect],st=e.shiftKey?10:1;
    if(e.key==='ArrowLeft')L.x-=st/W;if(e.key==='ArrowRight')L.x+=st/W;if(e.key==='ArrowUp')L.y-=st/H;if(e.key==='ArrowDown')L.y+=st/H;
  }
});

/* ---------- demo content / auto-save load ---------- */
(function initStudio(){
  const restored = restoreFromLocalStorage();
  if(!restored){
    const lines=[['Lights are fading on the highway',0,4.5],['Silver moon is leading me home',4.5,9],['Every wave a quiet whisper',9,13.5],['Carrying the night away',13.5,18],['Hold the glow, let it breathe',18,23],['We are drifting through the dark',23,28]];
    S.captions=lines.map(l=>({id:uid(),text:l[0],start:l[1],end:l[2],anim:'inherit'}));
    applyTemplate('aurora');
    const o={id:uid(),name:OVP.floating.name,start:0,end:S.duration,seed:7,p:{...OVBASE,...OVP.floating.p}};S.overlays.push(o);
  }
  FONTS.forEach(ensureFont);
})();

/* ---------- main loop ---------- */
let lastNow=performance.now(),lastTL=-1;
function loop(now){
  const dt=Math.min(.1,(now-lastNow)/1000);lastNow=now;
  const t=curTime();F.t=t;F.dur=S.duration;
  analyse(dt);
  render(vctx,vk,true);
  if(exporting)tickExport();
  $('#timeTxt').textContent=fmtT(t,1)+' / '+fmtT(S.duration,1);
  $('#bPlay').textContent=F.playing?'⏸ Pause':'▶ Play';
  if(playheadEl){
    playheadEl.style.transform=`translateX(${t*TL.pps}px)`;
    if(F.playing&&TL.follow){const x=t*TL.pps,sl=tlScroll.scrollLeft,w=tlScroll.clientWidth;if(x>sl+w-60||x<sl)tlScroll.scrollLeft=Math.max(0,x-60)}
  }
  requestAnimationFrame(loop);
}
fitCanvas();syncToolbar();renderPanel();buildTimeline();setPps(60);
if(!SUPPORT.length)toast('Note: this browser cannot record video (try Chrome/Edge)');
requestAnimationFrame(loop);
</script>
